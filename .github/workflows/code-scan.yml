name: Security Audit (SBOM & CBOM)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Audit-App Security Pipeline
        uses: menonkrishna57/Audit-App@main
        with:
          google-api-key: ${{ secrets.GOOGLE_API_KEY }}
