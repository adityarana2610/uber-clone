name: "Code Scan & AI Fix Suggestions"

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  security-audit:
    uses: adityarana2610/Internal-Audit-App/.github/workflows/code-scan.yml@test-ai-scanner
    with:
      scan_python: true
      scan_javascript: false       # uber-clone is pure Python
      run_tests: false
      python_dir: "app"            # your Python files are inside the app/ folder
      fail_on_errors: false        # keeps it green while giving AI fixes
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.INTERNALAUDITAPP }}
